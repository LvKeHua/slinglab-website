name = "tokenomics-screener"
main = "src/worker.js"
compatibility_date = "2026-07-22"

workers_dev = true

kv_namespaces = [
  { binding = "MARKET_DATA", id = "6d56b8307fd04814892f9c2b15723c02" }
]

routes = [
  { pattern = "app.slinglab.xyz/screener/*", zone_id = "3b21d2fc8d5e020709d21d74f95753c2" }
]

[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via `wrangler secret put`):
#   CMC_API_KEY      - CoinMarketCap Pro API 密钥
#   COINGECKO_API_KEY - CoinGecko API 密钥 (可选)
#   UPLOAD_AUTH_KEY   - 上传接口认证密钥
